name: Build and release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Package addon
        run: |
          mkdir -p dist/ClassicPlatesPlus
          cp -R ClassicPlatesPlus/. dist/ClassicPlatesPlus/
          find dist/ClassicPlatesPlus -type f -name ".DS_Store" -delete
          cd dist
          zip -r ../ClassicPlatesPlus-${{ github.ref_name }}.zip ClassicPlatesPlus

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ClassicPlatesPlus-${{ github.ref_name }}.zip